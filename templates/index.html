<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sukose | Portfolio</title>
<meta name="description" content="Portfolio of Sukose, Python, Flask and web developer.">
<link rel="stylesheet" href="{{ estatico('style.css') }}">
<script src="{{ estatico('extras.js') }}" defer></script>
<script src="{{ estatico('main.js') }}" defer></script>
</head>
<body>
<div class="marquesina" aria-hidden="true">
  <span data-i18n="marquesina">welcome to my page :3</span>
</div>

<header class="portada">
  <h1>Sukose</h1>
  <p data-i18n="lema">automation, microservices and web tools</p>
</header>

<main class="escritorio">
  <section class="ventana" data-titulo="vHola">
    <div class="contenido">
      <p data-i18n="p1"></p>
      <p data-i18n="p2"></p>
      <p data-i18n="p3"></p>
    </div>
  </section>

  <section class="ventana" data-titulo="vServicios">
    <div class="contenido"><ul id="servicios-lista" class="lista"></ul></div>
  </section>

  <section class="ventana" data-titulo="vHabilidades">
    <div class="contenido"><ul id="habilidades" class="fichas"></ul></div>
  </section>

  <section class="ventana" data-titulo="vProyectos">
    <div class="contenido" id="proyectos-lista"></div>
  </section>

    <section class="ventana" data-titulo="vYo">
    <div class="contenido"><ul id="yo-lista" class="lista"></ul></div>
  </section>

  <section class="ventana" data-titulo="vTerminal">
    <div class="contenido negra terminal">
      <div id="terminal-salida" role="log" aria-live="polite"></div>
      <label class="terminal-linea">
        <span aria-hidden="true">&gt;</span>
        <input id="terminal-entrada" type="text" maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
    </div>
  </section>
  
  <section class="ventana" data-titulo="vAhora">
    <div class="contenido"><ul id="ahora-lista" class="lista"></ul></div>
  </section>

  <section class="ventana acento" data-titulo="vRedes">
    <div class="contenido negra"><ul id="contacto-lista" class="lista-redes"></ul></div>
  </section>
</main>

<nav class="tareas" id="tareas" aria-label="Windows">
  <div id="tareas-lista"></div>
  <button type="button" id="idioma">ES</button>
  <span id="reloj"></span>
</nav>
</body>
</html>
